    <style>
    /* 启动页：系统启动屏 → 覆盖层 → 游戏首帧，三段保持同一版式、同一 logo 尺寸 */
    #tq-boot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;
        background:#fff;overflow:hidden;pointer-events:none;
        transition:opacity .3s linear}
    #tq-boot.tq-hide{opacity:0}
    /* 启动阶段整页白底：html/body 都铺白，避免两侧露出深空底图、窗口底色或灰色边带 */
    html.tq-booting, html.tq-booting body{background:#fff !important;background-image:none !important}
    #tq-boot-stage{position:absolute;left:0;top:0;right:0;bottom:0;font-family:arial,helvetica,sans-serif}
    /* logo 与系统启动屏严格同位：视口正中（启动屏实测 center=50%），标题出现也不移动 */
    #tq-boot-icon{position:absolute;left:50%;top:50%;height:39.6vh;width:39.6vh;
        transform:translate(-50%,-50%);border:0;display:block}
    #tq-boot-run{display:none}
    /* 进度条与文字复刻引擎 loader：条在底部、文字在条下，左右对齐条的两端 */
    #tq-boot-track{position:absolute;left:16vw;right:16vw;bottom:19vh;height:2.7vh;
        background:#3c4046;border-radius:999px;overflow:hidden;
        box-shadow:inset 0 1px 3px rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.05),
                   0 .6vh 1.8vh rgba(60,64,70,.14);
        animation:tqin .5s cubic-bezier(.2,.7,.3,1) .1s both}
    /* 未拿到引擎真实进度前：不定态滚动条（渐变+流光，不显示假百分比） */
    #tq-boot-fill{position:absolute;left:0;top:0;height:100%;width:35%;border-radius:999px;
        overflow:hidden;background:linear-gradient(90deg,#37aec2 0%,#59BFCE 55%,#9ceef8 100%);
        box-shadow:0 0 10px rgba(89,191,206,.55);
        transform-origin:0 50%;will-change:transform;
        animation:tqslide 1.8s cubic-bezier(.45,0,.55,1) infinite}
    #tq-boot-shine{position:absolute;top:0;left:0;height:100%;width:45%;display:block;
        border-radius:inherit;pointer-events:none;
        background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);
        transform:translateX(-130%);animation:tqshine 1.6s ease-in-out infinite}
    @keyframes tqslide{0%{transform:translateX(-12%)}50%{transform:translateX(188%)}100%{transform:translateX(-12%)}}
    @keyframes tqshine{0%{transform:translateX(-130%)}60%,100%{transform:translateX(330%)}}
    #tq-boot-info{position:absolute;left:16vw;right:16vw;bottom:13.4vh;
        display:flex;align-items:baseline;justify-content:space-between;
        animation:tqin .5s cubic-bezier(.2,.7,.3,1) .1s both}
    #tq-boot-txt{font-size:3.0vh;line-height:1;color:#5a6573;letter-spacing:.04em}
    #tq-boot-pct{font-size:3.7vh;line-height:1;color:#2b8ea3;font-weight:700;
        letter-spacing:.01em;font-variant-numeric:tabular-nums}
    /* 进度增长时的柔光脉冲：跟随填充条头部，向外扩散后淡出 */
    #tq-boot-pulse{position:absolute;left:16vw;bottom:calc(19vh + 1.35vh);
        width:9vh;height:9vh;margin:0 0 -4.5vh -4.5vh;border-radius:50%;
        pointer-events:none;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,rgba(156,238,248,.72) 0%,rgba(89,191,206,.3) 40%,rgba(89,191,206,0) 72%);
        transition:left .45s cubic-bezier(.25,.8,.3,1)}
    #tq-boot-pulse.pv{animation:tqpulse .95s cubic-bezier(.3,.5,.3,1)}
    @keyframes tqpulse{0%{opacity:0;transform:scale(.5)}32%{opacity:.55}100%{opacity:0;transform:scale(1.25)}}
    /* 「正在初始化…」的省略号呼吸动画 */
    #tq-boot-txt .tqdot{display:inline-block;animation:tqdot 1.2s linear infinite}
    #tq-boot-txt .tqdot:nth-child(3){animation-delay:.2s}
    #tq-boot-txt .tqdot:nth-child(4){animation-delay:.4s}
    @keyframes tqdot{0%,60%,100%{opacity:.15}30%{opacity:1}}
    @keyframes tqin{from{opacity:0;transform:translateY(.7vh)}to{opacity:1;transform:none}}
    </style>

    <script>
    (function(){
      var KEY='用户信息';
      var KEYS=['用户名','多多号','密码','达斯特入侵','亚比背包','挑战之路','王牌风暴','亚比仓库','天启星盘'];
      var curId=null;
      var __tqIdType=null, __tqInputTypes=null;
      function genId(){ return String(Math.floor(10000+Math.random()*90000)); }
      function makeJson(id){
        var k=[],v=[],i,vals=['小奥拉',id,'','未开启','未开启','未开启','未开启','未开启','未开启'];
        for(i=0;i<KEYS.length;i++){ k.push([KEYS[i]]); v.push([vals[i]]); }
        return JSON.stringify({xfarray:true,size:[2,KEYS.length,1],data:[k,v]});
      }
      function isInputType(ty){
        if(!ty) return false;
        var pid=ty.plugin&&ty.plugin.id;
        if(pid===19) return true;
        var n=ty.name;
        return typeof n==='string'&&(n.indexOf('输入框')>=0||n==='奥拉名注册'||n.indexOf('兑换码')>=0||n.indexOf('搜索')>=0);
      }
      function getInputTypes(rt){
        if(__tqInputTypes) return __tqInputTypes;
        var out=[], list=(rt&&rt.types_by_index)||[];
        for(var i=0;i<list.length;i++) if(isInputType(list[i])) out.push(list[i]);
        if(out.length) __tqInputTypes=out;
        return out;
      }
      function fill(){
        if(!curId) return;
        try{
          var rt=window.xfruntime;
          if(!rt||!rt.types_by_index) return;
          if(!__tqIdType){
            for(var i=0;i<rt.types_by_index.length;i++){
              var t=rt.types_by_index[i];
              if(t&&t.name==='多多号输入框'){ __tqIdType=t; break; }
            }
          }
          var ty=__tqIdType;
          if(!ty||!ty.instances) return;
          for(var j=0;j<ty.instances.length;j++){
            var o=ty.instances[j];
            if(!o||o.isDestroyed||o.__tqFilled) continue;
            o.__tqFilled=true;
            if(!o.value){
              o.value=curId;
              if(o.setText) o.setText();
            }
          }
        }catch(e){}
      }
      function init(){
        var lf=window.localforage;
        if(!lf){ setTimeout(init,100); return; }
        lf.getItem(KEY).then(function(v){
          if(v){
            try{
              var o=(typeof v==='string')?JSON.parse(v):v;
              curId=o.data[1][1][0];
            }catch(e){}
          }
          if(!curId){
            curId=genId();
            return lf.setItem(KEY, makeJson(curId));
          }
        }).then(fill).catch(function(){});
        setInterval(fill,1000);
      }
      init();
      var glowTimer=setInterval(glow,200);
      function glow(){
        try{
          var rt=window.xfruntime, c=rt&&rt.canvas;
          if(!c||!rt.running_layout||rt.running_layout.name==='入口') return;
          if(c.clientWidth>window.innerWidth*0.5&&c.clientHeight>window.innerHeight*0.5){
            c.classList.add('tq-ready');
            document.documentElement.classList.remove('tq-booting');
            clearInterval(glowTimer);
          }
        }catch(e){}
      }
      function focusAt(ev){
        if(!/android/i.test(navigator.userAgent)) return;
        try{
          var rt=window.xfruntime, c=rt&&rt.canvas;
          if(!rt||!c||!window.xf||!window.xf.checkTouchable) return;
          var ts=ev.changedTouches, t=ts&&ts[0];
          if(!t) return;
          var px=t.pageX-c.offsetLeft, py=t.pageY-c.offsetTop, hit=null;
          var list=getInputTypes(rt);
          for(var i=0;i<list.length&&!hit;i++){
            var ty=list[i];
            if(!ty||!ty.instances) continue;
            for(var j=0;j<ty.instances.length;j++){
              var o=ty.instances[j];
              if(!o||o.isDestroyed||!o.inputProxy||!o.visible||!o.layer||!o.layer.visible) continue;
              if(!o.layer.layout||o.layer.layout!==rt.running_layout) continue;
              if(window.xf.checkTouchable(o,px,py)){ hit=o; break; }
            }
          }
          if(!hit) return;
          if(ev.cancelable) ev.preventDefault();
          hit.focus();
        }catch(e){}
      }
      document.addEventListener('touchstart',focusAt,{capture:true,passive:false});
    })();
    </script>
    <script>
    /* 非按钮类可点击对象：统一的按下反馈（透明度脉冲） */
    (function(){
      var NAMES = ('星球 基因秘境PVE 音乐开关 亚比背包亚比球 亚比背包技能展示 亚比背包特性 特性图标 ' +
        'BOSS方战斗Buff 选中亚比蛋 天启之塔挑战图标 天赋道具框 仓库切换 亚比蛋图标 固化放置 ' +
        '天启之塔 生态园 接天之廊 伏天之城 亚比研究中心 蓝宝石要塞 奥拉广场 极天之门 奥拉之树 欢乐岛 ' +
        '十字大道 HELLO学院 我的家园 流星购物街 传送核心 指挥中心 主题公园 战斗星域 风暴沙漠 光影森林 ' +
        '六芒前殿 海枯小镇 水上都市 晨光大陆 奇灵神树 基因秘境 白皇殿 寒冰王座 太阳神殿 龙皇殿 青龙堂 ' +
        '烈焰宝塔 雀皇殿 玄皇殿 考验之巅 烈焰洞穴 龙族圣殿 玄武堂 选择之殿 ' +
        '艾夕区 索里德区 思伍德区 比特区 发明岛 费尔区 海文花园 雷鸣大陆 沃尔特区 艺术之都 上古神殿 ' +
        '艾夕 索里德 思伍德 沃尔特 费尔 比特 海文 雷鸣 艺术 发明').split(' ');
      /* NPC小图不参与透明度反馈：点击 NPC 会让角色模型短暂变透明，观感异常 */
      var FAMS = '背包道具 地图进入按钮 异空间按钮 亚比背包道具实例 亚比装备同类组'.split(' ');
      var SKIP = {'地图':1,'不可点击部分':1,'不可点击':1};
      var SKIPFAM = {'地图':1};
      var TYPE = {}, FAM = {}, i;
      for(i=0;i<NAMES.length;i++) TYPE[NAMES[i]]=1;
      for(i=0;i<FAMS.length;i++) FAM[FAMS[i]]=1;
      var lastTouch=0;
      function isClickable(ty){
        if(!ty||!ty.name||SKIP[ty.name]) return false;
        var fs=ty.families;
        if(fs) for(var k=0;k<fs.length;k++) if(fs[k]&&SKIPFAM[fs[k].name]) return false;
        if(TYPE[ty.name]) return true;
        if(fs) for(var k=0;k<fs.length;k++) if(fs[k]&&FAM[fs[k].name]) return true;
        return false;
      }
      function topAt(rt,px,py){
        var lay=rt.running_layout;
        if(!lay||!lay.layers) return null;
        var layers=lay.layers;
        for(var k=layers.length-1;k>=0;k--){
          var l=layers[k];
          if(!l||!l.visible||typeof l.getFirstTouch!=='function') continue;
          var o=l.getFirstTouch(px,py);
          if(o) return o;
        }
        return null;
      }
      function press(o){
        if(!o||o.isDestroyed||!window.TWEEN) return;
        var now=Date.now();
        if(o.__tqPressAt&&now-o.__tqPressAt<120) return;
        o.__tqPressAt=now;
        if(o.__tqDown) o.__tqDown.stop();
        if(o.__tqUp) o.__tqUp.stop();
        var base=(typeof o.opacity==='number')?o.opacity:1;
        o.__tqBase=base;
        o.__tqDown=new TWEEN.Tween({v:base}).to({v:Math.max(0.25,base*0.55)},70)
          .easing(tweenEase())
          .onUpdate(function(tv){ if(!o.isDestroyed) o.opacity=tv.v; }).start();
        clearTimeout(o.__tqTimer);
        o.__tqTimer=setTimeout(function(){ restore(o); },140);
      }
      function restore(o){
        if(!o||o.isDestroyed||!window.TWEEN) return;
        if(o.__tqDown) o.__tqDown.stop();
        var base=(typeof o.__tqBase==='number')?o.__tqBase:1;
        var from=(typeof o.opacity==='number')?o.opacity:base;
        o.__tqUp=new TWEEN.Tween({v:from}).to({v:base},150)
          .easing(tweenEase())
          .onUpdate(function(tv){ if(!o.isDestroyed) o.opacity=tv.v; }).start();
      }
      function tweenEase(){
        var E=TWEEN.Easing;
        return (E&&E.Quadratic&&E.Quadratic.Out)?E.Quadratic.Out:E.Linear.None;
      }
      function onDown(ev){
        try{
          if(ev.type==='touchstart') lastTouch=Date.now();
          else if(Date.now()-lastTouch<800) return;
          var tag=ev.target&&ev.target.tagName;
          if(tag&&/^(INPUT|TEXTAREA|SELECT|BUTTON)$/i.test(tag)) return;
          var rt=window.xfruntime;
          if(!rt||!rt.canvas||!rt.running_layout||!window.xf||!xf.checkTouchable) return;
          if(window.xf.MessageBox&&xf.MessageBox.isMessageBoxShow&&xf.MessageBox.isMessageBoxShow()) return;
          var c=rt.canvas, t=ev.changedTouches&&ev.changedTouches[0];
          var px=(t?t.pageX:ev.pageX)-c.offsetLeft, py=(t?t.pageY:ev.pageY)-c.offsetTop;
          if(!(px>=0&&py>=0&&px<=c.clientWidth&&py<=c.clientHeight)) return;
          var o=topAt(rt,px,py);
          if(!o||!o.type) return;
          if(o.type.plugin&&o.type.plugin.id===13) return;
          if(!xf.checkTouchable(o,px,py)) return;
          if(!isClickable(o.type)) return;
          var lay=rt.running_layout;
          if(lay&&lay.width&&lay.height&&typeof o.width==='number'&&typeof o.height==='number'&&
             o.width*o.height>lay.width*lay.height*0.5) return;
          press(o);
        }catch(e){}
      }
      document.addEventListener('touchstart',onDown,{capture:true,passive:true});
      document.addEventListener('mousedown',onDown,{capture:true,passive:true});
    })();
    </script>

<script>
/* 启动页：系统启动屏结束后由覆盖层接管（同 logo 尺寸、整页白底）；
   引擎自带 loader 藏在覆盖层下方，等它真正结束（isSplashing true→false）再淡出，
   用户只会看到「系统 logo → 覆盖层 → 游戏画面」三段，前两段版式一致 */
(function(){
  var el=document.getElementById('tq-boot');
  var pct=document.getElementById('tq-boot-pct');
  var fill=document.getElementById('tq-boot-fill');
  var pulse=document.getElementById('tq-boot-pulse');
  if(!el||!pct||!fill) return;

  var t0=Date.now(), done=false, real=false, shown=-1, lastPulse=0;
  /* 进度条默认不定态滚动（CSS keyframes，合成线程驱动，不显示假百分比）；
     一旦读到引擎真实进度 rt.progress(0~100)，切成确定态并同步数字 */
  function showReal(p){
    p=Math.max(0,Math.min(100,p));
    if(!real){
      real=true;
      fill.style.animation='none';
      fill.style.transform='none';
      fill.style.width='0%';
      fill.style.transition='width .45s cubic-bezier(.25,.8,.3,1)';
      var ph=document.getElementById('tq-boot-ph');
      if(ph) ph.textContent='正在加载';
    }
    fill.style.width=p+'%';
    if(pulse){
      pulse.style.left=(16+68*p/100)+'vw';
      var now=Date.now();
      /* 脉冲节流：进度更新很密时保持约每 0.9s 一次的柔和呼吸，避免闪烁 */
      if(now-lastPulse>900){
        lastPulse=now;
        pulse.classList.remove('pv');
        void pulse.offsetWidth;
        pulse.classList.add('pv');
      }
    }
    var ip=Math.floor(p);
    if(ip!==shown){ shown=ip; pct.textContent=ip+'%'; }
  }

  function hide(){
    if(done) return;
    done=true;
    /* 启动阶段结束：撤掉整页白底，恢复深空底色，避免游戏画布两侧出现白色边带 */
    document.documentElement.classList.remove('tq-booting');
    el.className='tq-hide';
    setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); },400);
  }
  /* 引擎 loader 画在自己的 overlay canvas 上并置 isSplashing=true；
     它变为 false 时 loader 已被移除、首个布局正在启动，再等 300ms 让首帧上屏再淡出 */
  var sawSplash=false, endAt=0;
  var raf=window.requestAnimationFrame||function(f){ return setTimeout(f,16); };
  (function tick(){
    if(done) return;
    try{
      var rt=window.xfruntime;
      if(rt){
        if(typeof rt.progress==='number'&&rt.progress>0) showReal(rt.progress);
        if(rt.isSplashing){
          sawSplash=true; endAt=0;
        }else if(sawSplash){
          if(!endAt) endAt=Date.now();
          var wait=Date.now()-endAt;
          if(wait>300&&(rt.running_layout||wait>1500)){ hide(); return; }
        }else if(rt.running_layout&&rt.progress>=100){
          /* 资源已加载完但没观察到 loader 过程（极快加载）时兜底 */
          showReal(100); hide(); return;
        }
      }
    }catch(e){}
    if(Date.now()-t0>120000){ hide(); return; }
    raf(tick);
  })();
})();
</script>
