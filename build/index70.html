    <script>
    (function(){
      var KEY='用户信息';
      var KEYS=['用户名','多多号','密码','达斯特入侵','亚比背包','挑战之路','王牌风暴','亚比仓库','天启星盘'];
      var curId=null;
      var __tqIdType=null, __tqInputTypes=null;
      function genId(){ return String(Math.floor(10000+Math.random()*90000)); }
      function makeJson(id){
        var k=[],v=[],i,vals=['小奥拉',id,'','未开启','未开启','未开启','未开启','未开启','未开启'];
        for(i=0;i<KEYS.length;i++){ k.push([KEYS[i]]); v.push([vals[i]]); }
        return JSON.stringify({xfarray:true,size:[2,KEYS.length,1],data:[k,v]});
      }
      function isInputType(ty){
        if(!ty) return false;
        var pid=ty.plugin&&ty.plugin.id;
        if(pid===19) return true;
        var n=ty.name;
        return typeof n==='string'&&(n.indexOf('输入框')>=0||n==='奥拉名注册'||n.indexOf('兑换码')>=0||n.indexOf('搜索')>=0);
      }
      function getInputTypes(rt){
        if(__tqInputTypes) return __tqInputTypes;
        var out=[], list=(rt&&rt.types_by_index)||[];
        for(var i=0;i<list.length;i++) if(isInputType(list[i])) out.push(list[i]);
        if(out.length) __tqInputTypes=out;
        return out;
      }
      function fill(){
        if(!curId) return;
        try{
          var rt=window.xfruntime;
          if(!rt||!rt.types_by_index) return;
          if(!__tqIdType){
            for(var i=0;i<rt.types_by_index.length;i++){
              var t=rt.types_by_index[i];
              if(t&&t.name==='多多号输入框'){ __tqIdType=t; break; }
            }
          }
          var ty=__tqIdType;
          if(!ty||!ty.instances) return;
          for(var j=0;j<ty.instances.length;j++){
            var o=ty.instances[j];
            if(!o||o.isDestroyed||o.__tqFilled) continue;
            o.__tqFilled=true;
            if(!o.value){
              o.value=curId;
              if(o.setText) o.setText();
            }
          }
        }catch(e){}
      }
      function init(){
        var lf=window.localforage;
        if(!lf){ setTimeout(init,100); return; }
        lf.getItem(KEY).then(function(v){
          if(v){
            try{
              var o=(typeof v==='string')?JSON.parse(v):v;
              curId=o.data[1][1][0];
            }catch(e){}
          }
          if(!curId){
            curId=genId();
            return lf.setItem(KEY, makeJson(curId));
          }
        }).then(fill).catch(function(){});
        setInterval(fill,1000);
      }
      init();
      var glowTimer=setInterval(glow,200);
      function glow(){
        try{
          var rt=window.xfruntime, c=rt&&rt.canvas;
          if(!c||!rt.running_layout) return;
          var LN=rt.running_layout.name;
          if(LN==='入口'||LN==='数据载入界面'||LN==='加载界面'||LN==='登录界面'||LN==='星球选择界面') return;
          if(c.clientWidth>window.innerWidth*0.5&&c.clientHeight>window.innerHeight*0.5){
            c.classList.add('tq-ready');
            document.documentElement.classList.remove('tq-booting');
            clearInterval(glowTimer);
          }
        }catch(e){}
      }
      function focusAt(ev){
        if(!/android/i.test(navigator.userAgent)) return;
        try{
          var rt=window.xfruntime, c=rt&&rt.canvas;
          if(!rt||!c||!window.xf||!window.xf.checkTouchable) return;
          var ts=ev.changedTouches, t=ts&&ts[0];
          if(!t) return;
          var px=t.pageX-c.offsetLeft, py=t.pageY-c.offsetTop, hit=null;
          var list=getInputTypes(rt);
          for(var i=0;i<list.length&&!hit;i++){
            var ty=list[i];
            if(!ty||!ty.instances) continue;
            for(var j=0;j<ty.instances.length;j++){
              var o=ty.instances[j];
              if(!o||o.isDestroyed||!o.inputProxy||!o.visible||!o.layer||!o.layer.visible) continue;
              if(!o.layer.layout||o.layer.layout!==rt.running_layout) continue;
              if(window.xf.checkTouchable(o,px,py)){ hit=o; break; }
            }
          }
          if(!hit) return;
          if(ev.cancelable) ev.preventDefault();
          hit.focus();
        }catch(e){}
      }
      document.addEventListener('touchstart',focusAt,{capture:true,passive:false});
    })();
    </script>
    <script>
    /* 非按钮类可点击对象：统一的按下反馈（透明度脉冲） */
    (function(){
      var NAMES = ('星球 基因秘境PVE 音乐开关 亚比背包亚比球 亚比背包技能展示 亚比背包特性 特性图标 ' +
        'BOSS方战斗Buff 选中亚比蛋 天启之塔挑战图标 天赋道具框 仓库切换 亚比蛋图标 固化放置 ' +
        '天启之塔 生态园 接天之廊 伏天之城 亚比研究中心 蓝宝石要塞 奥拉广场 极天之门 奥拉之树 欢乐岛 ' +
        '十字大道 HELLO学院 我的家园 流星购物街 传送核心 指挥中心 主题公园 战斗星域 风暴沙漠 光影森林 ' +
        '六芒前殿 海枯小镇 水上都市 晨光大陆 奇灵神树 基因秘境 白皇殿 寒冰王座 太阳神殿 龙皇殿 青龙堂 ' +
        '烈焰宝塔 雀皇殿 玄皇殿 考验之巅 烈焰洞穴 龙族圣殿 玄武堂 选择之殿 ' +
        '艾夕区 索里德区 思伍德区 比特区 发明岛 费尔区 海文花园 雷鸣大陆 沃尔特区 艺术之都 上古神殿 ' +
        '艾夕 索里德 思伍德 沃尔特 费尔 比特 海文 雷鸣 艺术 发明').split(' ');
      /* NPC小图不参与透明度反馈：点击 NPC 会让角色模型短暂变透明，观感异常 */
      var FAMS = '背包道具 地图进入按钮 异空间按钮 亚比背包道具实例 亚比装备同类组'.split(' ');
      var SKIP = {'地图':1,'不可点击部分':1,'不可点击':1};
      var SKIPFAM = {'地图':1};
      var TYPE = {}, FAM = {}, i;
      for(i=0;i<NAMES.length;i++) TYPE[NAMES[i]]=1;
      for(i=0;i<FAMS.length;i++) FAM[FAMS[i]]=1;
      var lastTouch=0;
      function isClickable(ty){
        if(!ty||!ty.name||SKIP[ty.name]) return false;
        var fs=ty.families;
        if(fs) for(var k=0;k<fs.length;k++) if(fs[k]&&SKIPFAM[fs[k].name]) return false;
        if(TYPE[ty.name]) return true;
        if(fs) for(var k=0;k<fs.length;k++) if(fs[k]&&FAM[fs[k].name]) return true;
        return false;
      }
      function topAt(rt,px,py){
        var lay=rt.running_layout;
        if(!lay||!lay.layers) return null;
        var layers=lay.layers;
        for(var k=layers.length-1;k>=0;k--){
          var l=layers[k];
          if(!l||!l.visible||typeof l.getFirstTouch!=='function') continue;
          var o=l.getFirstTouch(px,py);
          if(o) return o;
        }
        return null;
      }
      function press(o){
        if(!o||o.isDestroyed||!window.TWEEN) return;
        var now=Date.now();
        if(o.__tqPressAt&&now-o.__tqPressAt<120) return;
        o.__tqPressAt=now;
        if(o.__tqDown) o.__tqDown.stop();
        if(o.__tqUp) o.__tqUp.stop();
        var base=(typeof o.opacity==='number')?o.opacity:1;
        o.__tqBase=base;
        o.__tqDown=new TWEEN.Tween({v:base}).to({v:Math.max(0.25,base*0.55)},70)
          .easing(tweenEase())
          .onUpdate(function(tv){ if(!o.isDestroyed) o.opacity=tv.v; }).start();
        clearTimeout(o.__tqTimer);
        o.__tqTimer=setTimeout(function(){ restore(o); },140);
      }
      function restore(o){
        if(!o||o.isDestroyed||!window.TWEEN) return;
        if(o.__tqDown) o.__tqDown.stop();
        var base=(typeof o.__tqBase==='number')?o.__tqBase:1;
        var from=(typeof o.opacity==='number')?o.opacity:base;
        o.__tqUp=new TWEEN.Tween({v:from}).to({v:base},150)
          .easing(tweenEase())
          .onUpdate(function(tv){ if(!o.isDestroyed) o.opacity=tv.v; }).start();
      }
      function tweenEase(){
        var E=TWEEN.Easing;
        return (E&&E.Quadratic&&E.Quadratic.Out)?E.Quadratic.Out:E.Linear.None;
      }
      /* 端午活动提示弹窗（提示面板 / 活动通知文本 / 关闭通知按钮 / 端午遮挡）
         游戏事件里只有创建动作、没有给这几个对象绑定任何点击/关闭事件，
         所以右上角叉号点了没反应，遮罩还会挡住整个画面。这里补一个关闭。 */
      var NOTICE = {'关闭通知按钮':1,'提示面板':1,'活动通知文本':1,'端午遮挡':1};
      var CLOSE_BTN = '关闭通知按钮';
      /* 只有点中右上角叉号才关：按叉号实例的实际矩形判定，不依赖引擎拾取 */
      function hitCloseBtn(rt,px,py){
        var types=rt.types_by_index||[];
        for(var i=0;i<types.length;i++){
          var t=types[i];
          if(!t||t.name!==CLOSE_BTN||!t.instances) continue;
          for(var j=0;j<t.instances.length;j++){
            var o=t.instances[j];
            if(!o||o.isDestroyed||!o.visible) continue;
            if(o.layer&&o.layer.layout&&o.layer.layout!==rt.running_layout) continue;
            var w=o.width||0,h=o.height||0;
            if(!w||!h) continue;
            if(Math.abs(px-o.x)<=w/2&&Math.abs(py-o.y)<=h/2) return true;
          }
        }
        return false;
      }
      function closeNotice(rt){
        var types=rt.types_by_index||[], n=0;
        for(var i=0;i<types.length;i++){
          var t=types[i];
          if(!t||!t.instances||!NOTICE[t.name]) continue;
          for(var j=t.instances.length-1;j>=0;j--){
            var o=t.instances[j];
            if(!o||o.isDestroyed||!o.visible) continue;
            if(o.layer&&o.layer.layout&&o.layer.layout!==rt.running_layout) continue;
            try{
              if(typeof o.Destroy==='function') o.Destroy();
              else if(rt&&typeof rt.DestroyInstance==='function') rt.DestroyInstance(o);
              else continue;
              n++;
            }catch(e){}
          }
        }
        return n;
      }
      function onDown(ev){
        try{
          if(ev.type==='touchstart') lastTouch=Date.now();
          else if(Date.now()-lastTouch<800) return;
          var tag=ev.target&&ev.target.tagName;
          if(tag&&/^(INPUT|TEXTAREA|SELECT|BUTTON)$/i.test(tag)) return;
          var rt=window.xfruntime;
          if(!rt||!rt.canvas||!rt.running_layout||!window.xf||!xf.checkTouchable) return;
          if(window.xf.MessageBox&&xf.MessageBox.isMessageBoxShow&&xf.MessageBox.isMessageBoxShow()) return;
          var c=rt.canvas, t=ev.changedTouches&&ev.changedTouches[0];
          var px=(t?t.pageX:ev.pageX)-c.offsetLeft, py=(t?t.pageY:ev.pageY)-c.offsetTop;
          if(!(px>=0&&py>=0&&px<=c.clientWidth&&py<=c.clientHeight)) return;
          var o=topAt(rt,px,py);
          if(!o||!o.type) return;
          if(NOTICE[o.type.name]){
            if(o.type.name===CLOSE_BTN||hitCloseBtn(rt,px,py)){
              if(ev.stopPropagation) ev.stopPropagation();
              closeNotice(rt);
            }
            return;
          }
          if(o.type.plugin&&o.type.plugin.id===13) return;
          if(!xf.checkTouchable(o,px,py)) return;
          if(!isClickable(o.type)) return;
          var lay=rt.running_layout;
          if(lay&&lay.width&&lay.height&&typeof o.width==='number'&&typeof o.height==='number'&&
             o.width*o.height>lay.width*lay.height*0.5) return;
          press(o);
        }catch(e){}
      }
      document.addEventListener('touchstart',onDown,{capture:true,passive:true});
      document.addEventListener('mousedown',onDown,{capture:true,passive:true});
    })();
    </script>
